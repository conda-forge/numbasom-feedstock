{% set name = "numbasom" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: d424ca4907b54d46dab3e3aa3d438568d64a50e20a3539419602b43e00083ed5

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - numba
    - numpy
    - matplotlib-base

test:
  imports:
    - numbasom
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/nmarincic/numbasom
  license: Apache-2.0
  license_file: LICENSE
  summary: A Fast Self-Organizing Map Python Library Implemented in Numba
  description: |
    NumbaSOM is a fast and simple to use Self-Organizing Map library.
    It utilizes online training (one data point at a time) rather than
    batch training. The implemented topologies are a simple 2D lattice or a torus.
  dev_url: https://github.com/nmarincic/numbasom
  doc_url: https://nmarincic.github.io/numbasom/

extra:
  recipe-maintainers:
    - nmarincic
